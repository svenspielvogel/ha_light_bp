---
blueprint:
  name: Motion-activated Light (mit Failsafe-Ausschalten)
  description: >
    Schaltet ein Licht bei erkannter Bewegung ein und nach Ablauf der Wartezeit
    wieder aus. Erweiterung gegenüber dem Original-Blueprint: Ein Failsafe
    versucht das Ausschalten so lange zu wiederholen, bis der State aller
    Ziel-Lichter tatsächlich "off" meldet. Das behebt das Problem, dass Geräte
    zeitweise nicht erreichbar sind und das Licht sonst an bleiben würde.
  domain: automation
  source_url: https://github.com/svenspielvogel/ha_light_bp/blob/main/motion_light_failsafe.yaml
  author: Sven Spielvogel (basierend auf Home Assistant "Motion-activated Light")
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
          filter:
            - device_class: occupancy
              domain: binary_sensor
            - device_class: motion
              domain: binary_sensor
    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected.
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    failsafe_retry_delay:
      name: Failsafe - Wartezeit zwischen Ausschaltversuchen
      description: >
        Zeit, die zwischen zwei Versuchen gewartet wird, das Licht auszuschalten,
        falls der State noch nicht "off" meldet (z. B. weil das Gerät gerade
        nicht erreichbar ist).
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
    failsafe_max_retries:
      name: Failsafe - Maximale Anzahl Ausschaltversuche
      description: >
        Sicherheitslimit, damit die Automatisierung nicht unendlich läuft.
        Wird die Anzahl erreicht, bricht der Failsafe ab (das Licht könnte dann
        weiterhin an sein, falls das Gerät dauerhaft nicht erreichbar ist).
      default: 60
      selector:
        number:
          min: 1
          max: 1000
          unit_of_measurement: attempts

# If motion is detected within the delay,
# we restart the script.
mode: restart
max_exceeded: silent

triggers:
  trigger: state
  entity_id: !input motion_entity
  from: "off"
  to: "on"

variables:
  # Ziel-Lichter als konkrete Entity-Liste auflösen. Das light_target kann
  # Entities, Devices oder Areas enthalten; expand() liefert die tatsächlichen
  # Entity-Objekte, aus denen wir die IDs ziehen.
  light_target: !input light_target
  # entity_id / device_id / area_id im Target koennen jeweils ein einzelner
  # String ODER eine Liste sein. Deshalb jeden Teil zuerst zu einer Liste
  # normalisieren (String -> [String]), bevor sie zusammengefuehrt werden.
  _entity_ids: >-
    {% set v = light_target.entity_id | default([]) %}
    {{ [v] if v is string else v }}
  _device_ids: >-
    {% set v = light_target.device_id | default([]) %}
    {{ [v] if v is string else v }}
  _area_ids: >-
    {% set v = light_target.area_id | default([]) %}
    {{ [v] if v is string else v }}
  target_light_entities: >-
    {{ expand(
         _entity_ids
         + (_device_ids | map('device_entities') | sum(start=[]))
         + (_area_ids | map('area_entities') | sum(start=[]))
       )
       | selectattr('domain', 'eq', 'light')
       | map(attribute='entity_id')
       | list }}

actions:
  - alias: "Turn on the light"
    action: light.turn_on
    target: !input light_target
  - alias: "Wait until there is no motion from device"
    wait_for_trigger:
      trigger: state
      entity_id: !input motion_entity
      from: "on"
      to: "off"
  - alias: "Wait the number of seconds that has been set"
    delay: !input no_motion_wait
  - alias: "Failsafe: so lange ausschalten, bis der State off meldet"
    repeat:
      # Schleife stoppt, sobald keines der Ziel-Lichter mehr "on" ist,
      # oder wenn das Sicherheitslimit an Versuchen erreicht wurde.
      until:
        - condition: template
          value_template: >-
            {{ (target_light_entities
                | select('is_state', 'on')
                | list | count) == 0
               or repeat.index >= (failsafe_max_retries | int) }}
      sequence:
        - alias: "Ausschalten anstoßen (Versuch {{ repeat.index }})"
          action: light.turn_off
          target: !input light_target
        - alias: "Kurz warten, damit der State aktualisiert werden kann"
          delay: !input failsafe_retry_delay
